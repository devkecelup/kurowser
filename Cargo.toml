[package]
name = "kurowser"
version = "1.0.0"
edition = "2021"
description = "Ultra-lightweight native Windows browser in Rust + Win32 + WebView2 with Tab Folders and Kurowser Shields"
license = "MIT"

[dependencies]
png = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tao = "0.30"
webview2-com = "0.33"
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Security_Cryptography",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_WinRT",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
